name: Android CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up current Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902

      - name: Install Android SDK 37
        run: sdkmanager --channel=3 "platforms;android-37" "build-tools;36.0.0"

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BdaySquirrel-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
