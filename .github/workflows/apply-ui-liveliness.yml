name: Apply UI liveliness patch

on:
  push:
    branches:
      - feat/android-mvp-scaffold
    paths:
      - dev-patches/apply_ui_liveliness.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded source edits
        run: python dev-patches/apply_ui_liveliness.py

      - name: Remove one-shot patch machinery
        run: |
          rm dev-patches/apply_ui_liveliness.py
          rm .github/workflows/apply-ui-liveliness.yml
          rmdir dev-patches 2>/dev/null || true

      - name: Commit integrated UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ui: add yearless picker and retrowave motion"
          git push origin HEAD:feat/android-mvp-scaffold
