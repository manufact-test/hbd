name: Apply profile and picker feedback

on:
  push:
    branches:
      - feat/android-mvp-scaffold
    paths:
      - dev-patches/apply_profile_picker_feedback.py
      - .github/workflows/apply-profile-picker-feedback.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/android-mvp-scaffold
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python dev-patches/apply_profile_picker_feedback.py

      - name: Remove one-shot patch files
        run: |
          rm dev-patches/apply_profile_picker_feedback.py
          rm .github/workflows/apply-profile-picker-feedback.yml

      - name: Commit integrated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: polish birthday picker and profile details"
          git push origin HEAD:feat/android-mvp-scaffold
