name: Apply onboarding UI integration

on:
  push:
    branches:
      - feat/android-mvp-scaffold
    paths:
      - dev-patches/apply_onboarding_ui.py
      - .github/workflows/apply-onboarding-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/android-mvp-scaffold
          fetch-depth: 0

      - name: Apply guarded source patch
        run: python dev-patches/apply_onboarding_ui.py

      - name: Commit integrated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate onboarding and contacts import UI"
          git push origin HEAD:feat/android-mvp-scaffold
