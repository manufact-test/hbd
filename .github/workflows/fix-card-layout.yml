name: Fix birthday card effect layout

on:
  push:
    branches:
      - feat/android-mvp-scaffold

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix effect overlay scope
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/bdaysquirrel/app/ui/BdaySquirrelApp.kt')
          text = path.read_text(encoding='utf-8')
          marker = '\n        PixelBurstOverlay(\n'
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one PixelBurstOverlay marker, got {text.count(marker)}')
          path.write_text(text.replace(marker, '\n        }\n\n        PixelBurstOverlay(\n', 1), encoding='utf-8')
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-card-layout.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep pixel burst outside birthday card layout"
          git push origin HEAD:feat/android-mvp-scaffold
